<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>랜선 스키장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#cfe6ff;font-family:'Jua',system-ui,sans-serif;color:#2c3a4a;-webkit-user-select:none;user-select:none}
#app canvas{display:block;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
.chip{position:fixed;background:rgba(255,255,255,.92);border:3px solid #cfdcea;border-radius:999px;padding:7px 15px;box-shadow:0 4px 0 rgba(40,70,110,.15);font-size:16px;z-index:5}
#loc{top:12px;left:12px}
#obj{top:56px;left:12px;font-size:14px;background:#fff6d6;border-color:#f3d77a;display:none}
#best{top:100px;left:12px;font-size:13px;display:none}
#tools{position:fixed;top:12px;right:68px;display:flex;gap:6px;z-index:5}
#tools button{font-family:inherit;font-size:14px;border:3px solid #cfdcea;background:#fff;border-radius:999px;padding:6px 11px;cursor:pointer;color:#2c3a4a}
#mini{cursor:pointer;position:fixed;top:12px;right:12px;border:3px solid #cfdcea;border-radius:16px;background:#fff;z-index:5;box-shadow:0 4px 0 rgba(40,70,110,.15)}
#help{position:fixed;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.88);border:3px solid #cfdcea;border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.65;z-index:5;max-width:230px}
#help b{color:#2f6fb0;font-weight:400}
#help.off{display:none}
#hud{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;z-index:5;pointer-events:none}
#spd{background:rgba(20,35,55,.78);color:#fff;border-radius:18px;padding:6px 18px;font-size:30px;min-width:150px;text-align:center}
#spd small{font-size:14px;opacity:.75;margin-left:4px}
#stance{display:flex;gap:6px}
#stance span{background:rgba(255,255,255,.9);border-radius:999px;padding:3px 10px;font-size:13px;border:2px solid #cfdcea}
#stance span.on{background:#2f6fb0;color:#fff;border-color:#2f6fb0}
#steer{width:240px;height:10px;border-radius:5px;background:rgba(255,255,255,.7);position:relative;border:2px solid #cfdcea}
#steer i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#2f6fb0;left:50%;transform:translateX(-50%)}
#prompt{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(20,35,55,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:16px;display:none;z-index:6;pointer-events:none;white-space:nowrap}
#liftbar{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:none;z-index:7;text-align:center;pointer-events:none}
#liftbar .k{font-size:34px;color:#fff;background:#e5533d;border-radius:20px;padding:10px 26px;box-shadow:0 5px 0 #a8321f;animation:pulse .4s infinite alternate}
#liftbar .bar{margin:10px auto 0;width:260px;height:12px;border-radius:6px;background:rgba(255,255,255,.8);overflow:hidden}
#liftbar .bar i{display:block;height:100%;background:#e5533d;width:100%}
@keyframes pulse{to{transform:scale(1.06)}}
#chase{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#e5533d;color:#fff;border-radius:16px;padding:8px 18px;font-size:18px;z-index:7;display:none;text-align:center;box-shadow:0 4px 0 #a8321f}
#chase small{display:block;font-size:13px;opacity:.9}
#toast{position:fixed;top:24%;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:rgba(20,35,55,.88);color:#fff;padding:10px 20px;border-radius:999px;font-size:18px;z-index:20;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
#trick{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:44px;color:#ffd23f;text-shadow:0 3px 0 #b5800a,0 0 12px rgba(0,0,0,.25);z-index:8;pointer-events:none;opacity:0;transition:opacity .3s}
#chat{position:fixed;left:12px;bottom:14px;width:min(300px,calc(100vw - 30px));z-index:6}
#log{max-height:120px;overflow-y:auto;margin-bottom:6px;font-size:13px;display:flex;flex-direction:column;gap:3px}
#log div{background:rgba(255,255,255,.88);border-radius:12px;padding:3px 10px;align-self:flex-start;max-width:100%;word-break:break-all}
#log .sys{background:rgba(255,246,214,.95)}
#msg{width:100%;font-family:inherit;font-size:15px;padding:8px 13px;border-radius:999px;border:3px solid #cfdcea;background:rgba(255,255,255,.95);outline:none;color:#2c3a4a}
.modal{position:fixed;inset:0;background:rgba(20,35,55,.4);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.modal.on{display:flex}
.sheet{background:#fff;border:4px solid #cfdcea;border-radius:24px;padding:20px;width:min(470px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 8px 0 rgba(40,70,110,.2)}
.sheet h2{font-weight:400;font-size:24px;text-align:center;margin-bottom:4px}
.sheet .sub{text-align:center;color:#7d8da0;font-size:14px;margin-bottom:12px}
.sheet label{display:block;color:#7d8da0;font-size:14px;margin:10px 0 6px;text-align:center}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{font-family:inherit;font-size:16px;padding:10px 14px;border-radius:16px;border:3px solid #cfdcea;background:#fff;cursor:pointer;color:#2c3a4a}
.opt.sel{border-color:#2f6fb0;background:#e7f1fb}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfdcea;cursor:pointer}
.sw.sel{box-shadow:0 0 0 3px #2f6fb0}
.btn{font-family:inherit;font-size:17px;border:none;border-radius:999px;padding:11px 20px;cursor:pointer;background:#2f6fb0;color:#fff;box-shadow:0 4px 0 #1f4f82}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f4f82}
.btn.alt{background:#eef3f8;color:#2c3a4a;box-shadow:0 4px 0 #c7d3df}
.btn.warm{background:#f0a23b;box-shadow:0 4px 0 #b9741a}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#pvBox{position:sticky;top:-20px;background:#fff;z-index:2;padding:4px 0;border-bottom:2px dashed #e3ebf3}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.menu button{font-family:inherit;font-size:16px;padding:14px 8px;border-radius:16px;border:3px solid #cfdcea;background:#fff;cursor:pointer;color:#2c3a4a}
.menu button small{display:block;color:#7d8da0;font-size:12px;margin-top:2px}
#start input{display:block;margin:0 auto;width:220px;text-align:center;font-family:inherit;font-size:18px;padding:10px;border-radius:14px;border:3px solid #cfdcea;outline:none;color:#2c3a4a}
#edu{position:fixed;inset:0;background:#1f3b5a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;text-align:center;padding:20px}
#edu.on{display:flex}
#edu h2{font-weight:400;font-size:30px;margin-bottom:8px}
#edu .slide{font-size:24px;min-height:90px;margin:18px 0;line-height:1.5}
#edu .cnt{font-size:60px;color:#ffd23f}
#acts{position:fixed;right:14px;bottom:18px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;z-index:8}
#acts button{font-family:inherit;border:none;cursor:pointer;color:#fff;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#acts .main{background:#2f6fb0;font-size:19px;padding:16px 22px;min-width:96px}
#acts .sub{background:#5a86b8;font-size:15px;padding:10px 16px}
#acts .dim{opacity:.75}
#acts .hot{background:#e5533d;font-size:24px;padding:20px 30px;animation:pulse .4s infinite alternate}
#acts .tog{background:rgba(255,255,255,.92);color:#2c3a4a;border:3px solid #cfdcea;font-size:15px;padding:9px 14px}
#acts .tog.on{background:#2f6fb0;color:#fff;border-color:#2f6fb0}
#acts .grp{display:flex;gap:8px}
#acts.top{top:58px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);flex-direction:row;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 140px)}
#acts.top button{font-size:14px;padding:8px 12px;min-width:0;animation:none}
#acts.top .main{background:rgba(47,111,176,.9)}
#brake{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);color:#fff;background:rgba(229,83,61,.85);border-radius:999px;padding:4px 14px;font-size:14px;display:none;z-index:6;pointer-events:none}
@media (pointer:coarse){#chase{top:auto;bottom:128px;font-size:15px;width:max-content;max-width:94vw}body.sliding #chat,body.sliding #obj,body.sliding #tools{display:none}#acts.top{top:56px;left:12px;transform:none;justify-content:flex-start}#chat{width:calc(100vw - 170px)}#log{max-height:80px}#prompt{bottom:auto;top:22%}}
body.touch #obj,body.touch #best,body.touch #help,body.touch #prompt,body.touch #steer,body.touch #stance,body.touch #tools{display:none!important}
body.touch #loc{font-size:13px;padding:5px 11px;border-width:2px;top:10px;left:10px}
body.touch #mini{cursor:pointer;width:84px;height:124px;top:10px;right:10px;opacity:.85;border-width:2px;border-radius:12px}
#mapBtn{position:fixed;top:10px;right:10px;z-index:9;width:46px;height:46px;border-radius:50%;border:2px solid #cfdcea;background:rgba(255,255,255,.95);font-size:22px;cursor:pointer;box-shadow:0 3px 0 rgba(40,70,110,.15)}
#menuBtn{display:none;position:fixed;top:14px;right:64px;z-index:9;width:38px;height:38px;border-radius:50%;border:2px solid #cfdcea;background:rgba(255,255,255,.92);font-size:18px;font-family:inherit;color:#2c3a4a}
body.touch #menuBtn{display:block}
body.touch #chat{width:calc(100vw - 150px);left:10px;bottom:12px}
body.touch #msg{display:none}
body.touch.chatOpen #msg{display:block}
body.touch #log{max-height:none}
body.touch #log div{transition:opacity .6s}
body.touch #log div.old{opacity:0}
body.touch #hud{bottom:12px}
body.touch #spd{font-size:20px;padding:4px 14px;min-width:96px;border-radius:14px}
body.touch #toast{font-size:15px;top:18%;max-width:92vw;white-space:normal;text-align:center;border-radius:18px}
body.touch #chase{bottom:64px;font-size:14px;padding:6px 14px}
body.touch #chase small{display:none}
body.touch #acts{right:10px;bottom:12px}
body.touch #acts .main{font-size:17px;padding:13px 18px;min-width:84px}
body.touch #acts.top{top:54px;left:10px;bottom:auto;right:auto;transform:none}
@media (max-width:700px),(pointer:coarse){#help{display:none}#tools{left:12px;right:auto;top:98px;bottom:auto}#tHelp{display:none}#best{top:140px}#mini{width:110px;height:162px}#obj{max-width:calc(100vw - 140px);white-space:normal;border-radius:16px}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<div id="loc" class="chip">📍 리조트 입구</div>
<div id="obj" class="chip"></div>
<div id="best" class="chip">🏃 오늘의 최장 도주: -</div>
<button id="menuBtn">⋯</button><div id="tools"><button id="tCam">🎥 시점</button><button id="tTime">🌗 시간</button><button id="tWear">👕 옷</button><button id="tHelp">❓ 키</button></div>
<canvas id="mini" width="170" height="385" style="display:none"></canvas><button id="mapBtn">🗺️</button>
<div id="help"></div>
<div id="hud"><div id="stance"></div><div id="steer"><i></i></div><div id="spd">0<small>km/h</small></div></div>
<div id="prompt"></div><div id="acts"></div><div id="brake">브레이크</div>
<div id="liftbar"><div class="k">⬇ 하차장!</div><div class="bar"><i></i></div></div>
<div id="chase"></div>
<div id="toast"></div>
<div id="trick"></div>
<div id="chat"><div id="log"></div><input id="msg" maxlength="60" placeholder="Enter로 채팅…" autocomplete="off"></div>
<div id="modal" class="modal"><div class="sheet" id="modalIn"></div></div>
<div id="start" class="modal on"><div class="sheet">
  <h2>⛷️ 랜선 스키장</h2>
  <div class="sub">데모 버전 · 혼자 타보기<br>📱 한 손가락: 누르고 있는 쪽으로 이동 · 스키는 손가락 좌우로 회전, 아래로 끌면 브레이크, 위로 튕기면 점프</div>
  <label>닉네임</label><input id="nm" maxlength="8" value="스키어">
  <label>캐릭터</label>
  <div class="opts"><button class="opt sel" data-g="m">🧑 남자</button><button class="opt" data-g="f">👩 여자</button></div>
  <div class="row"><button class="btn" id="goGate">🏁 입구부터 시작</button></div>
  <div class="row"><button class="btn alt" id="goSki">⚡ 바로 출발 (스키)</button><button class="btn alt" id="goBoard">⚡ 바로 출발 (보드)</button></div>
</div></div>
<div id="edu"><h2>🚨 안전교육실</h2><div>썰매는 압수됐어요. 교육을 마치면 나갈 수 있어요.</div><div class="slide" id="eduS"></div><div class="cnt" id="eduC">10</div></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="assets.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t)};
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const V3=THREE.Vector3;
const G=9.8;

/* ================= 렌더러 ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.4:1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('#app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe0ff);
scene.fog=new THREE.Fog(0xcfe6ff,180,900);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1500);
const hemi=new THREE.HemisphereLight(0xffffff,0x8a9bb0,0.62);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e6,0.72);sun.castShadow=true;const ms_=matchMedia('(pointer:coarse)').matches?1024:2048;sun.shadow.mapSize.set(ms_,ms_);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:260});sun.shadow.bias=-0.0007;
scene.add(sun);scene.add(sun.target);
const fx=$('#fx'),fxc=fx.getContext('2d');
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);fx.width=innerWidth;fx.height=innerHeight}
addEventListener('resize',resize);resize();

const mats={};
const M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
function mesh(geo,c,x=0,y=0,z=0,p){const m=new THREE.Mesh(geo,typeof c==='number'?M(c):c);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m}
const box=(w,h,d,c,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z,p);
const cyl=(rt,rb,h,c,x,y,z,p,s=14)=>mesh(new THREE.CylinderGeometry(rt,rb,h,s),c,x,y,z,p);
const sph=(r,c,x,y,z,p)=>mesh(new THREE.SphereGeometry(r,16,12),c,x,y,z,p);
const cone=(r,h,c,x,y,z,p,s=12)=>mesh(new THREE.ConeGeometry(r,h,s),c,x,y,z,p);
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function label(text,{bg='rgba(255,255,255,.95)',fg='#2c3a4a',scale=3,depth=false,font=52}={}){
  const tex=canvasTex(512,128,(g,w,h)=>{g.font=`${font}px Jua, sans-serif`;const tw=Math.min(500,g.measureText(text).width+50);g.fillStyle=bg;rr(g,(w-tw)/2,20,tw,88,40);g.fill();g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,66)});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:depth,transparent:true}));s.scale.set(scale,scale/4,1);if(!depth)s.renderOrder=10;return s}
function bubble(text){
  const lines=[];let s=text;while(s.length&&lines.length<3){lines.push(s.slice(0,13));s=s.slice(13)}
  const tex=canvasTex(512,256,(g,w,h)=>{g.font='44px Jua, sans-serif';let tw=0;lines.forEach(l=>tw=Math.max(tw,g.measureText(l).width));tw+=56;const bh=lines.length*52+34,y0=h-30-bh;
    g.fillStyle='#fff';g.strokeStyle='#cfdcea';g.lineWidth=6;rr(g,(w-tw)/2,y0,tw,bh,32);g.fill();g.stroke();g.beginPath();g.moveTo(w/2-15,y0+bh-3);g.lineTo(w/2,h-6);g.lineTo(w/2+15,y0+bh-3);g.fill();
    g.fillStyle='#2c3a4a';g.textAlign='center';g.textBaseline='middle';lines.forEach((l,i)=>g.fillText(l,w/2,y0+17+26+i*52))});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));sp.scale.set(3.4,1.7,1);sp.renderOrder=11;return sp}

/* ================= 지형 ================= */
const PLATEAU=625;
function Hd(d){if(d<=0)return 0;const dd=Math.min(d,PLATEAU);let y=0.000336*dd*dd+0.08*dd;if(d>PLATEAU)y+=(d-PLATEAU)*0.03;return d<25?y*smooth(0,25,d):y}
const LANES=[
  {id:'green',name:'토끼 언덕',lv:'초급',icon:'🟢',col:0x3fb950,d0:150,d1:0,cx:d=>-112+10*Math.sin(d/40),w:40},
  {id:'park',name:'보드 파크',lv:'점프',icon:'🟠',col:0xf28c28,d0:215,d1:35,cx:d=>-58,w:36},
  {id:'blue',name:'자작나무 코스',lv:'중급',icon:'🔵',col:0x2f81f7,d0:638,d1:0,cx:d=>-5+28*Math.sin(d/45),w:26},
  {id:'black',name:'늑대 능선',lv:'상급 · 모굴',icon:'⚫',col:0x222222,d0:638,d1:0,cx:d=>58+6*Math.sin(d/80),w:22},
  {id:'double',name:'블랙 다이아',lv:'선수급 · 협곡+빙판',icon:'⚫⚫',col:0x111111,d0:638,d1:0,cx:d=>106+4*Math.sin(d/30),w:14},
  {id:'wave',name:'롤러코스터 웨이브',lv:'중급 · 파도 언덕',icon:'🌊',col:0x2fb0b0,d0:638,d1:150,cx:d=>-118-14*smooth(150,260,d)+7*Math.sin(d/60),w:22},
  {id:'pipe',name:'하프파이프',lv:'벽 타고 점프',icon:'🌀',col:0x8a5ad8,d0:638,d1:215,cx:d=>-58-18*smooth(225,330,d)+5*Math.sin(d/55)*smooth(330,400,d),w:26},
  {id:'glade',name:'숲속 트리런',lv:'상급 · 나무 사이',icon:'🌲',col:0x2e6a48,d0:638,d1:0,cx:d=>150+8*Math.sin(d/70),w:28}
];
const LN={};LANES.forEach(l=>LN[l.id]=l);
function corrDist(x,d){
  if(d<28)return -5;
